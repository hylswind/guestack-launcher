# Launches a Guestack instance. This workflow is the attested launcher: the launch record it
# publishes (launch.json) carries a GitHub artifact attestation naming this repository, this
# workflow file and the exact commit it ran from. See OPERATOR.md before running it.
name: launcher

on:
  workflow_dispatch:

permissions:
  id-token: write # Sigstore signing for the attestation
  attestations: write
  contents: write # the Release that carries launch.json

concurrency:
  group: launcher
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Launch
        run: bash launcher/launch.sh
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          FUNCTIONS_PROJECT_NAME: ${{ secrets.FUNCTIONS_PROJECT_NAME }}
          PAGE_PROJECT_NAME: ${{ secrets.PAGE_PROJECT_NAME }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
          API_CUSTOM_HOST: ${{ secrets.API_CUSTOM_HOST }}
          WRANGLER_SEND_METRICS: "false"

      - name: Attest launch.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: launch.json

      - name: Upload launch.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-${{ github.run_id }}
          path: launch.json
          if-no-files-found: error

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "launch-${GITHUB_RUN_ID}" launch.json \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Launch ${GITHUB_RUN_ID}" \
            --notes "Attested launch record. Verify with: gh attestation verify launch.json --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/launcher.yml"
