<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Guestack</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { max-width: 26rem; padding: 2rem 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .buttons { display: grid; gap: .75rem; margin-top: 1rem; }
  button { font: inherit; padding: .7rem 1rem; border-radius: .5rem; border: 1px solid; cursor: pointer; }
  .privacy { opacity: .8; font-size: .95rem; }
  .notice { font-weight: 600; }
  .error { color: #b3261e; }
  @media (prefers-color-scheme: dark) { .error { color: #f2b8b5; } }
</style>
<script type="module" src="./app.js"></script>
</head>
<body>
<main>
  <h1>Guestack</h1>
  <div id="app" aria-live="polite"><p>Loading…</p></div>
  <noscript><p>Guestack needs JavaScript to sign you in.</p></noscript>
</main>
</body>
</html>
